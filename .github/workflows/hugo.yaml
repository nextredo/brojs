# Originally used the GitHub action from the hugo docs
# Changed to using a different build (peaceiris) and deploying to a branch instead
#
# Original:
# https://gohugo.io/host-and-deploy/host-on-github-pages/
#
# Peaceiris version:
# https://github.com/peaceiris/actions-hugo
# https://github.com/peaceiris/actions-gh-pages

name: GitHub Pages

on:
  push:
    branches:
      # Branch to deploy
      - main
  pull_request:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -x {0} # Print commands before execution
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          # extended: true

      - name: Build
        run: hugo --gc --minify --cleanDestinationDir

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      - name: Generate homepage screenshot
        run: |
          # Install dependencies
          sudo apt-get update
          sudo apt-get install -y nodejs npm

          # Install Puppeteer
          pwd
          ls
          mkdir my-puppeteer-app && cd my-puppeteer-app
          npm init -y
          npm install puppeteer

          # Install chromium
          # npm puppeteer browsers install chrome --install-deps

          # Run the screenshotter
          node ${{ github.workspace }}/github/workflows/screenshotter.js
