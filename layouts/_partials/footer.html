<div class="footer-content">
  <!-- TODO add "powered by" statement -->
  <div>
    {{ with .Site.Copyright }}
      <a href="{{ "LICENSE" | relURL }}">{{ . }}</a>
    {{ end }}
    {{ with $.Site.Params.license.image }}
      <img class="footer-image" src="{{ . | relURL }}"/>
    {{ end }}
  </div>
  {{ with .Site.Params.repo_url }}
    <a href="{{ . }}">This website's code</a>
  {{ end }}
  <div>Site last updated: {{ .Site.Lastmod | time.Format ":date_medium" }}</div>
</div>
