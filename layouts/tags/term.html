{{ define "main" }}
  <h1>Posts tagged with "{{ .Title }}"</h1>
  <p>Found {{ .Pages | len }} {{ if eq (.Pages | len) 1 }}post{{ else }}posts{{ end }} with this tag.</p>

  <ul>
    {{- range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      </li>
    {{- end }}
  </ul>
{{ end }}
