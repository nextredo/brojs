{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <ul class="terms-tags">
    {{- $type := .Type }}
    {{- range $key, $value := .Data.Terms.Alphabetical }}
      {{- $name := .Name }}
      {{- $count := .Count }}
      {{- with site.GetPage (path.Join $type $name) }}
        <li>
          <a href="{{ .RelPermalink }}">
            {{ .LinkTitle }}
            <sup>{{ $count }}</sup>
          </a>
        </li>
      {{- end }}
    {{- end }}
  </ul>
{{ end }}
