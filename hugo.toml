# Hugo configuration
baseURL = "https://nextredo.github.io/brojs/"
title = "broJS Hugo Theme"

# Copyright notice to show at the bottom of the page
# copyright = "© 2026. All rights reserved."
copyright = "© MIT License"

[module]
  [module.hugoVersion]
    min = "0.146.0"

  # Explicitly keep existing static dir mount
  [[module.mounts]]
    source = "static"
    target = "static"

  # Mount LICENSE file
  [[module.mounts]]
    source = "LICENSE"
    target = "static/LICENSE"

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 1

  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 2

  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 3

  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 4

# Custom parameters
[params]
  repo_url = "https://github.com/nextredo/brojs"

  [params.footer]
    made_with_statement = true

  # Supplementary copyright license information
  [params.license]
    # Important to *NOT* have a leading "/" in the image path
    image = "https://img.shields.io/badge/license-MIT-green"
